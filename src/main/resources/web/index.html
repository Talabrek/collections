<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collections Admin</title>
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
    <div class="container">
        <!-- Connection status indicator (top right) -->
        <div id="connection-status" class="status-indicator" title="Checking connection..."></div>

        <!-- Header -->
        <header>
            <h1>Collections Admin</h1>
            <p class="subtitle">Manage your server's collections</p>
        </header>

        <!-- Main content area -->
        <main id="content">
            <!-- List view (default) -->
            <div id="view-list" class="view">
                <div class="view-header">
                    <h2>All Collections</h2>
                    <span id="collection-count" class="count-badge"></span>
                </div>
                <div id="collection-list" class="collection-grid">
                    <p class="loading">Loading collections...</p>
                </div>
            </div>

            <!-- Detail view (hidden by default) -->
            <div id="view-detail" class="view hidden">
                <div class="view-header">
                    <button id="back-btn" class="btn-back">&larr; Back to list</button>
                    <h2 id="detail-title">Collection Details</h2>
                </div>
                <div id="collection-detail">
                    <p class="loading">Loading...</p>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer>
            <p class="note">Collections Plugin Web Panel</p>
        </footer>
    </div>
    <script src="/js/app.js"></script>
</body>
</html>
